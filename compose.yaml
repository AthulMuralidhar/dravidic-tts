services:
  bhashavox:
    build:
      context: .
      target: runtime
    image: bhashavox:local
    init: true
    ports:
      - "${BHASHAVOX_BIND_PORT:-8000}:8000"
    environment:
      BHASHAVOX_TTS_PROVIDER: "${BHASHAVOX_TTS_PROVIDER:-espeak}"
      BHASHAVOX_MAX_CHARACTERS: "${BHASHAVOX_MAX_CHARACTERS:-5000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3));
          assert data['status']=='ok'
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

