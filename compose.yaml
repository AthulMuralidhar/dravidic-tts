services:
  dravidic-tts:
    build:
      context: .
      dockerfile: Dockerfile.neural
      target: neural-runtime
    image: dravidic-tts:neural-local
    init: true
    ports:
      - "${DRAVIDIC_TTS_BIND_PORT:-8000}:8000"
    environment:
      DRAVIDIC_TTS_PROVIDER: "${DRAVIDIC_TTS_PROVIDER:-indic-parler}"
      DRAVIDIC_TTS_MAX_CHARACTERS: "${DRAVIDIC_TTS_MAX_CHARACTERS:-5000}"
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3));
          assert data['status']=='ok'
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  hf-login:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile.neural
      target: neural-runtime
    image: dravidic-tts:neural-local
    stdin_open: true
    tty: true
    environment:
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - hf-cache:/home/app/.cache/huggingface
    entrypoint: ["hf", "auth", "login"]

  pdf-worker:
    profiles: ["batch"]
    build:
      context: .
      dockerfile: Dockerfile.neural
      target: neural-runtime
    image: dravidic-tts:neural-local
    environment:
      DRAVIDIC_TTS_PROVIDER: indic-parler
      HF_HOME: /home/app/.cache/huggingface
    volumes:
      - hf-cache:/home/app/.cache/huggingface
      - ./test-pdfs:/inputs:ro
      - ./outputs:/outputs
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    command:
      - python
      - -m
      - dravidic_tts.pdf_batch
      - /inputs/Nishayude_Ponnumon_Kambi_Novel.pdf
      - --output-root
      - /outputs/pdf
      - --language
      - ml
      - --voice
      - ml-anjali
      - --part-characters
      - "4000"

  audio-server:
    profiles: ["batch"]
    image: python:3.11-slim
    init: true
    ports:
      - "${DRAVIDIC_TTS_AUDIO_PORT:-8000}:8080"
    volumes:
      - ./outputs:/outputs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command:
      - python
      - -m
      - http.server
      - "8080"
      - --bind
      - 0.0.0.0
      - --directory
      - /outputs

volumes:
  hf-cache:
    name: dravidic-tts-hf-cache
